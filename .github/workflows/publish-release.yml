# This workflow builds every native executable and publishes a new release.
# It is triggered by pushes to the protected stable branch used for releases.
# This process is triggered via the GitHub UI using the create-release.yml action.

name: Publish a new release

on:
  push:
    branches: [ "stable" ]

permissions:
  contents: write

jobs:

  sync:
    runs-on: ubuntu-latest
    name: Merge stable branch into master

    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Create or reuse stable-to-master pull request
        run: |
          set -euo pipefail

          find_sync_pr() {
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head stable \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          }

          pr_number="$(find_sync_pr)"

          if [[ -z "$pr_number" ]]; then
            ahead_count="$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/master...stable" \
              --jq '.ahead_by')"

            if [[ ! "$ahead_count" =~ ^[0-9]+$ ]]; then
              echo "Failed to compare the stable and master branches." >&2
              exit 1
            fi

            if [[ "$ahead_count" == "0" ]]; then
              echo "The stable branch is already fully synced to master."
              exit 0
            fi

            if ! gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head stable \
              --title "Merge stable branch into master" \
              --body "Automatically sync the stable release branch back into master after publishing a release."; then
              echo "Pull request creation failed; checking whether another run created it." >&2
            fi

            pr_number="$(find_sync_pr)"
          fi

          if [[ -z "$pr_number" ]]; then
            echo "Failed to find the stable-to-master pull request." >&2
            exit 1
          fi

          echo "Submitting pull request #$pr_number to the master merge queue."
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY"

  build:
    uses: ./.github/workflows/build-native-all.yml

  sign:
    needs: build

    runs-on: ubuntu-latest
    name: Sign and attest the executables

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: stable

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        run: ls -lh artifacts

      - name: Import GPG key
        if: github.event.repository.full_name == 'hydephp/cli'
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
          trust_level: 5

      # Each platform's artifact is signed on its own. The self-update command resolves
      # `<asset>.sig.bin` for the platform it is running on, so the names have to line
      # up with App\Launcher\Platform exactly.
      - name: Sign every executable
        if: github.event.repository.full_name == 'hydephp/cli'
        run: |
          set -euo pipefail

          for artifact in artifacts/hyde-*; do
            case "$artifact" in *.sig|*.sig.bin) continue ;; esac

            echo "Signing $artifact"

            gpg --local-user 657B4D97184E9E6E596E6EA13B829782D5B7BA59 \
                --batch \
                --yes \
                --passphrase="${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}" \
                --detach-sign \
                --output "$artifact.sig" \
                "$artifact"
          done

      - name: Verify every signature
        if: github.event.repository.full_name == 'hydephp/cli'
        run: |
          set -euo pipefail

          gpg --import-ownertrust <<< "657B4D97184E9E6E596E6EA13B829782D5B7BA59:6:"

          for signature in artifacts/*.sig; do
            gpg --verify "$signature" "${signature%.sig}"
          done

      # The OpenSSL signature is the one `hyde self-update` verifies, because OpenSSL is
      # bundled with the executable while GPG may not be present on a user's machine.
      - name: Create OpenSSL fallback signatures
        if: github.event.repository.full_name == 'hydephp/cli'
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cert/"
          chmod 0700 "$HOME/.cert/"
          echo "${{ secrets.RSA_SIGNING_PRIVATE_KEY }}" > "$HOME/.cert/private_encrypted.key"
          echo "${{ secrets.RSA_SIGNING_KEY_PASSPHRASE }}" > "$HOME/.cert/passphrase.txt"
          openssl rsa -in "$HOME/.cert/private_encrypted.key" -out "$HOME/.cert/private.key" -passin file:"$HOME/.cert/passphrase.txt"

          for artifact in artifacts/hyde-*; do
            case "$artifact" in *.sig|*.sig.bin) continue ;; esac

            openssl dgst -sha512 -sign "$HOME/.cert/private.key" -out "$artifact.sig.bin" "$artifact"
          done

          rm -rf "$HOME/.cert/"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/hyde-linux-x86_64
            artifacts/hyde-linux-arm64
            artifacts/hyde-macos-x86_64
            artifacts/hyde-macos-arm64
            artifacts/hyde-windows-x86_64.exe

      - name: Upload the signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: sign

    runs-on: ubuntu-latest
    name: Publish release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: stable

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Prepare version information
        run: echo "VERSION=$(php ./bin/get-release-version.php)" >> $GITHUB_ENV

      - name: Print version information
        run: |
          echo "Version: v${{ env.VERSION }}"

      - name: Create a release
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af
        with:
          name: v${{ env.VERSION }}
          tag: v${{ env.VERSION }}
          commit: ${{ github.sha }}
          updateOnlyUnreleased: true
          generateReleaseNotes: true
          artifacts: artifacts/*
