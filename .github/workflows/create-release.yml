# This workflow allows for the creation of a new release through the GitHub UI.
# This is done by creating a pull request to the protected stable release branch.
# From there, the publish-release.yml workflow will take over and publish the release.

name: Create a new release PR

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: The SemVer level of the release
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:

  prepare-release:
    runs-on: ubuntu-latest
    name: Prepare a new release

    outputs:
      version: ${{ steps.build-version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: stable

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Capture stable CLI version
        id: stable-version
        run: |
          version="$(php ./bin/get-release-version.php)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Stable CLI version: v$version"

      - name: Pull latest changes from master
        run: |
          git fetch origin master:master
          git reset --hard master

      - name: Bump application version
        id: build-version
        run: |
          php ./bin/bump-application-version.php \
            "${{ github.event.inputs.type }}" \
            "${{ steps.stable-version.outputs.version }}"
          echo "version=$(php ./bin/get-release-version.php)" >> $GITHUB_OUTPUT
          echo "Version: v$(php ./bin/get-release-version.php)"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "HydeCLI v${{ steps.build-version.outputs.version }}"
          title: "HydeCLI v${{ steps.build-version.outputs.version }}"
          branch: "release/v${{ steps.build-version.outputs.version }}"
          delete-branch: true
          # The executables are no longer committed: there is one per platform now, and
          # they are built, signed and attested by publish-release.yml on merge.
          add-paths: |
            app/Application.php

          body: |
            This pull request was automatically created by the [HydeCLI release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Merging it publishes a new release. The native executables for every supported
            platform are built, signed and attested by the publish workflow at that point.
          labels: release

  # Build every artifact on the release branch as well, so a release PR cannot be merged
  # when one of the platforms does not build.
  verify-build:
    needs: prepare-release
    uses: ./.github/workflows/build-native-all.yml
