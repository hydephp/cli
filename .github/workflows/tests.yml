name: Test Suite

on:
  push:
    branches: [ "master", "v3", "develop", "stable", "release/**" ]
  pull_request:
    branches: [ "master", "v3", "develop", "stable", "release/**" ]

permissions:
  statuses: write

# This is the Build CI half of the pipeline: it is allowed to install PHP, Composer and
# a compiler toolchain. The Runtime CI half lives in runtime.yml, and proves the
# built artifact works on machines where none of that is present.

jobs:
  coverage-tests:
    runs-on: ubuntu-latest
    name: Run tests with coverage

    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          extensions: fileinfo, mbstring, dom, simplexml, xmlwriter

      - uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: "${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-php-

      # HydePHP v3 is unreleased and untagged, so `hyde/framework` and
      # `hyde/realtime-compiler` resolve from a develop@master checkout through a
      # Composer path repository. It is a build input, and has to be in place first.
      - name: Check out the HydePHP v3 development line
        shell: bash
        run: bash bin/sync-develop.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Composer caches `vendor` against the lock file, but a path repository's contents
      # change whenever the develop checkout moves while the lock stays identical. A restored
      # cache therefore serves a stale framework, silently. Re-mirroring is a local copy.
      - name: Re-mirror the development packages
        shell: bash
        run: composer reinstall hyde/framework hyde/realtime-compiler --no-interaction --no-progress

      - name: Execute the unit and feature suites
        run: vendor/bin/pest --testsuite=Unit,Feature --coverage --coverage-clover ./coverage.xml

      - name: Parse coverage report
        id: coverage
        run: |
          php -r '$xml = simplexml_load_file("coverage.xml"); echo round($xml->project->metrics["coveredelements"] / $xml->project->metrics["elements"] * 100, 2);' > coverage.txt
          echo "coverage=$(cat coverage.txt)" >> $GITHUB_OUTPUT

      - name: Send GitHub status check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # We need to find the correct commit SHA as pull requests have a different SHA
          if [ -z "${{ github.event.pull_request.head.sha }}" ]; then
              COMMIT_SHA=${{ github.sha }}
          else
              COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/hydephp/cli/statuses/${COMMIT_SHA} \
             -f "state=success" -f "target_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
             -f "description=Coverage is $(cat coverage.txt)%" -f "context=Code Coverage"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  run-tests:
    needs: coverage-tests

    if: contains(github.event.pull_request.labels.*.name, 'halt-matrix-tests') != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The executable bundles PHP 8.4, but the sources must stay installable on the
        # range the composer.json declares, since the CLI is also usable from source.
        php: ["8.2", "8.3", "8.4"]

    runs-on: ${{ matrix.os }}
    name: Run tests - ${{ matrix.os }} PHP ${{ matrix.php }}

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, dom, simplexml, xmlwriter

      - uses: actions/checkout@v4

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: "${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      # HydePHP v3 is unreleased and untagged, so `hyde/framework` and
      # `hyde/realtime-compiler` resolve from a develop@master checkout through a
      # Composer path repository. It is a build input, and has to be in place first.
      - name: Check out the HydePHP v3 development line
        shell: bash
        run: bash bin/sync-develop.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Composer caches `vendor` against the lock file, but a path repository's contents
      # change whenever the develop checkout moves while the lock stays identical. A restored
      # cache therefore serves a stale framework, silently. Re-mirroring is a local copy.
      - name: Re-mirror the development packages
        shell: bash
        run: composer reinstall hyde/framework hyde/realtime-compiler --no-interaction --no-progress

      - name: Execute the unit and feature suites
        run: vendor/bin/pest --testsuite=Unit,Feature

  fixture-integration:
    needs: coverage-tests

    runs-on: ubuntu-latest
    name: Composer fixture project

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, mbstring, dom, simplexml, xmlwriter

      - uses: actions/checkout@v4

      # HydePHP v3 is unreleased and untagged, so `hyde/framework` and
      # `hyde/realtime-compiler` resolve from a develop@master checkout through a
      # Composer path repository. It is a build input, and has to be in place first.
      - name: Check out the HydePHP v3 development line
        shell: bash
        run: bash bin/sync-develop.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Composer caches `vendor` against the lock file, but a path repository's contents
      # change whenever the develop checkout moves while the lock stays identical. A restored
      # cache therefore serves a stale framework, silently. Re-mirroring is a local copy.
      - name: Re-mirror the development packages
        shell: bash
        run: composer reinstall hyde/framework hyde/realtime-compiler --no-interaction --no-progress

      # The fixture is a real Hyde Composer project with a path-repository addon package.
      # Installing it here is project setup, not something the CLI ever needs to do.
      - name: Install the Composer fixture project
        run: composer install --no-interaction --no-progress --prefer-dist --working-dir=tests/Fixtures/composer-project

      - name: Re-mirror the fixture's development packages
        run: composer reinstall hyde/framework hyde/realtime-compiler --no-interaction --no-progress --working-dir=tests/Fixtures/composer-project

      - name: Prove the fixture works on its own
        run: |
          cd tests/Fixtures/composer-project
          php hyde test:addon --no-ansi | grep -q 'Addon command executed'
          php hyde list --no-ansi | grep -q 'test:addon'
