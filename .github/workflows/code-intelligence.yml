name: Code Intelligence

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  coverage-report:
    runs-on: ubuntu-latest
    name: Coverage and code insight report

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: xdebug
          extensions:
            fileinfo

      - uses: actions/checkout@v4

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      # HydePHP v3 is unreleased and untagged, so `hyde/framework` and
      # `hyde/realtime-compiler` resolve from a develop@master checkout through a
      # Composer path repository. It is a build input, and has to be in place first.
      - name: Check out the HydePHP v3 development line
        shell: bash
        run: bash bin/sync-develop.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-suggest --prefer-dist

      # Composer caches `vendor` against the lock file, but a path repository's contents
      # change whenever the develop checkout moves while the lock stays identical. A restored
      # cache therefore serves a stale framework, silently. Re-mirroring is a local copy.
      - name: Re-mirror the development packages
        shell: bash
        run: composer reinstall hyde/framework hyde/realtime-compiler --no-interaction --no-progress

      - name: Execute tests (Unit and Feature tests) via Pest
        run: vendor/bin/pest --coverage --coverage-html=coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
